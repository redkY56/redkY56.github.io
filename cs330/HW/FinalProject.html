<!DOCTYPE html>
<html>

<body>
<canvas id="gl-canvas" width="512" height="512"> </canvas>

<title>Diamond</title>

 <p> Distance </p> -2 <input id="sliderX" type="range"
 min="-2" max="2" step="0.1" value="2" /> 2
<p> Horizontal angle </p> -1 <input id="sliderRotate" type="range"
 min="-1" max="1" step="0.1" value="0" /> 1
 <p> Vertical angle </p> -1 <input id="sliderUpDown" type="range"
 min="-1" max="1" step="0.1" value="0" /> 1
 

<script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es

in  vec4 aPosition;
in  vec4 aColor;
out vec4 vColor;

uniform mat4 uModelViewMatrix;
uniform mat4 uProjectionMatrix;

void main()
{
    gl_Position = uProjectionMatrix*uModelViewMatrix*aPosition;
    vColor = aColor;
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es

precision mediump float;

in vec4 vColor;
out vec4 fColor;

void
main()
{
    fColor = vColor;
}
</script>

<script src="../Common/initShaders.js"></script>
<script src="../Common/MVnew.js"></script>
<script src="FinalProject.js"></script>

</body>
</html>
